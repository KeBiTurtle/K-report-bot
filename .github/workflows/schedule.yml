name: Stock Bot Auto Run

on:
  schedule:
    - cron: '30 8 * * 1-5'  # 한국 시간 오후 5시 30분 (평일)
    - cron: '0 0 * * 2-6'   # 한국 시간 오전 9시 (화~토)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v3
      - name: 파이썬 설치
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: 필요한 도구 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests yfinance pykrx finance-datareader beautifulsoup4
      - name: 파이썬 스크립트 실행
        run: python bot.py
